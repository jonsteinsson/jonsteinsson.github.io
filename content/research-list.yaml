  - id: 29
    title: The Power of Forward Guidance Revisited
    pdflink: "/papers/forwardguidance.pdf"
    coauthors: >-
      with [Alisdair McKay](https://alisdairmckay.com/) and [Emi Nakamura](http://eml.berkeley.edu/~enakamura)
    book: "*American Economic Review*, 106(10), 3133-3158, October 2016."
    abstract: >-
      In recent years, central banks have increasingly turned to forward
      guidance as a central tool of monetary policy. Standard monetary
      models imply that far future forward guidance has huge effects
      on current outcomes, and these effects grow with the horizon of
      the forward guidance. We present a model in which the power of
      forward guidance is highly sensitive to the assumption of complete
      markets. When agents face uninsurable income risk and borrowing
      constraints, a precautionary savings effect tempers their responses to
      changes in future interest rates. As a consequence, forward guidance
      has substantially less power to stimulate the economy
