  - id: 43
    title: A Plucking Model of Business Cycles
    pdflink: "/papers/plucking.pdf"
    coauthors: >-
      with [Stéphane Dupraz](http://www.stephaneduprazecon.com/) and [Emi Nakamura](http://eml.berkeley.edu/~enakamura)
    book: "*Journal of Monetary Economics*, 152, 103766, June 2025."
    abstract: >-
      In standard models, economic activity fluctuates symmetrically around a "natural rate" and
      stabilization policies can dampen these fluctuations but do not affect the average level of
      activity. An alternative view - labeled the "plucking model" by Milton Friedman - is that
      economic fluctuations are drops below the economy's full potential ceiling. We show that the
      dynamics of the unemployment rate in the US display a striking asymmetry that strongly favors
      the plucking model: increases in unemployment are followed by decreases of similar amplitude,
      while the amplitude of a decrease does not predict the amplitude of the following increase.
      In addition, business cycles last seven years on average and unemployment rises much faster
      during recessions than it falls during expansions. We augment a standard labor search model
      with downward nominal wage rigidity and show how it can fit the plucking property.
