  - id: 50
    title: 'The Commoditization of Labor'
    pdflink: "/papers/Commoditization.pdf"
    coauthors: >-
      with [Masao Fukui](https://masaofukui.com) and [Emi Nakamura](http://eml.berkeley.edu/~enakamura)
    abstract: >-
      Technical change often simplifies jobs. This increases productivity, but it also makes workers more substitutable---or more "commoditized". Commoditization of labor drives down worker bargaining power: anyone can do the job, implying workers are disposable, which improves the outside option of firms and can lower worker wages. We develop a model that captures both the productivity enhancing and wage depressing effects of commoditizing technical change. Commoditizing technical change involves firms standardizing tasks which implies that output is less sensitive to worker quality. Firms benefit because they can more easily fill vacancies for their durable jobs. We show that our model can help explain the divergence between productivity and wages in the service sector, increasing wage markdowns despite falling local concentration, and the decline of the large-firm wage premium. 
  - id: 49
    title: 'Disentangling Age, Time, and Cohort Effects in Income Inequality: A Proxy Machine Learning
      Approach'
    pdflink: "/papers/ATC_Paper.pdf"
    coauthors: >-
      with [David Bruns-Smith](https://brunssmith.com//) and [Emi Nakamura](http://eml.berkeley.edu/~enakamura)
    abstract: >-
      A canonical finding from earlier research is that the cross-sectional variance of income increases sharply with age (Deaton and Paxson, 1994). However, the trend in this age profile is
      not separately identified from time and cohort trends. Conventional methods solve this identification problem by ruling out “time effects.” This strong assumption is rejected by the data.
      We propose a new proxy variable machine learning approach to disentangle age, time and
      cohort effects. Using this method, we estimate a significantly smaller slope of the age profile
      of income variance for the US than conventional methods, as well as less erratic slopes for 11
      other countries.
  - id: 48
    title: Beyond the Taylor Rule
    pdflink: "/papers/Taylor_Rule.pdf"
    coauthors: >-
      with [Emi Nakamura](http://eml.berkeley.edu/~enakamura) and [Venance Riblier](https://venance-riblier.github.io/)
    book: Presented at the Jackson Hole Economic Policy Symposium, August 2025.
    abstract: >-
      The Federal Reserve partially “looked through” the post-Covid rise in inflation and ultimately managed to bring about an “immaculate disinflation.” The Fed’s policy deviated
      strongly from the Taylor rule during this period. More generally, central banks with strong
      inflation-fighting credentials looked through post-Covid inflationary shocks yet experienced
      less inflation than more hawkish but less credible central banks. In light of this episode, we
      assess the degree to which the Taylor rule is descriptive, and the degree to which it should be
      viewed as prescriptive. While the Taylor rule (generally) fits well during the Greenspan period, it (generally) fits poorly in the early 1980s and after the early 2000s. Academic work
      has emphasized the role of the Taylor rule in preventing self-fulfilling fluctuations (guaranteeing determinacy). These concerns can be addressed with a shock-contingent commitment
      and are fragile to deviations from fully rational expectations. We discuss three reasons why
      optimal policy may not always imply a one-for-one response of interest rates to inflation (forward guidance, correlated shocks, and “long and variable lags”). The main challenge arising
      from such policies is not indeterminacy but erosion of inflation-fighting credibility and potential deanchoring of long-run inflation expectations. Only central banks with strongly anchored
      inflation expectations and large amounts of inflation-fighting credibility are likely to be able to
      look through inflationary shocks.
