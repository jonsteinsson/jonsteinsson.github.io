  - id: 32
    title: 'The Discounted Euler Equation: A Note'
    pdflink: "/papers/discountedEuler.pdf"
    coauthors: >-
      with [Alisdair McKay](https://alisdairmckay.com/) and [Emi Nakamura](http://eml.berkeley.edu/~enakamura)
    book: "*Economica*, 84, 820-831, October 2017."
    abstract: >-
      We present a simple model with income risk and borrowing constraints that yields a ‘discounted Euler
      equation’. This feature of the model mutes the extent to which news about far future real interest rates (i.e.
      forward guidance) affects current outcomes. We show that this simple model approximates the outcomes
      of a rich model with uninsurable income risk and borrowing constraints in response to a forward guidance
      shock. The model is simple enough to be easily incorporated into simple New Keynesian models. We
      illustrate this with an application to the zero lower bound.
  - id: 31
    title: Informational Rigidities and the Stickiness of Temporary Sales
    pdflink: "/papers/stickysales.pdf"
    coauthors: >-
      with [Eric Anderson](http://www.kellogg.northwestern.edu/faculty/directory/anderson_eric_t.aspx),
      [Benjamin Malin](https://www.minneapolisfed.org/people/benjamin-a-malin), [Emi Nakamura](http://eml.berkeley.edu/~enakamura),
      and [Duncan Simester](https://mitsloan.mit.edu/faculty/directory/duncan-simester)
    book: "*Journal of Monetary Economics*, 90, 64-83, October 2017."
    abstract: >-
      How do retailers react to cost changes? While temporary sales account for 95% of price
      change in our data, retail prices respond to a wholesale cost increase entirely through
      the regular price. Sales actually respond temporarily in the opposite direction from regular
      prices, as though to conceal the price hike. Additional evidence from responses to commodity cost and local unemployment shocks, as well as broader evidence from BLS data,
      reinforces these findings. Institutional evidence indicates that sales are complex contingent
      contracts, determined substantially in advance. In a standard price-discrimination model,
      these institutional practices leave little money “on the table”.
  - id: 30
    title: 'Growth-Rate and Uncertainty Shocks in Consumption: Cross-Country Evidence'
    pdflink: "/papers/longrunrisk.pdf"
    coauthors: >-
      with [Emi Nakamura](http://eml.berkeley.edu/~enakamura) and [Dmitriy Sergeyev](https://sites.google.com/site/dmitriysergeyev/)
    book: "*American Economic Journal: Macroeconomics*, 9(1), 1-39, January 2017."
    abstract: >-
      We provide new estimates of the importance of growth-rate shocks and
      uncertainty shocks for developed countries. The shocks we estimate
      are large and correspond to well-known macroeconomic episodes
      such as the Great Moderation and the productivity slowdown. We compare our results to earlier estimates of “long-run risks” and assess
      the implications for asset pricing. Our estimates yield greater return
      predictability and a more volatile price-dividend ratio. In addition,
      we can explain a substantial fraction of cross-country variation in the
      equity premium. An advantage of our approach, based on macroeconomic data alone, is that the parameter estimates cannot be viewed as
      backward engineered to fit asset pricing data. We provide intuition for
      our results using the recently developed framework of shock-exposure
      and shock-price elasticities.
