  - id: 41
    title: Learning About the Long Run
    pdflink: "/papers/learning.pdf"
    coauthors: >-
      with [Leland Farmer](https://www.lelandfarmer.com/) and [Emi Nakamura](http://eml.berkeley.edu/~enakamura)
    book: "*Journal of Political Economy*, 132(10), 3334-3377, October 2024."
    abstract: >-
      Forecasts of professional forecasters are anomalous: they are biased,
      and forecast errors are autocorrelated and predictable by forecast revisions. We propose that these anomalies arise because professional
      forecasters do not know the model that generates the data. We show
      that Bayesian agents learning about hard-to-learn features of the world
      can generate all the prominent aggregate anomalies emphasized in
      the literature. We show this for professional forecasts of nominal interest rates and Congressional Budget Office forecasts of gross domestic
      product growth. Our learning model for interest rates can explain observed deviations from the expectations hypothesis of the term structure without relying on time variation in risk premia.
