    title: Are Chinese Growth and Inflation Too Smooth? Evidence from Engel Curves
    pdflink: "/papers/chinainflation.pdf"
    coauthors: >-
      with [Emi Nakamura](http://eml.berkeley.edu/~enakamura) and [Miao Liu](https://www.bc.edu/bc-web/schools/carroll-school/faculty-research/faculty-directory/miao-liu.html)
    book: "*American Economic Journal: Macroeconomics*, 8(3), 113-144, July 2016."
    abstract: >-
      China has experienced remarkably stable growth and inflation in
      recent years according to official statistics. We use systematic discrepancies between cross-sectional and time-series Engel curves to
      construct alternative estimates of Chinese growth and inflation. Our
      estimates suggest that official statistics present a smoothed version
      of reality. Official inflation rose in the 2000s, but our estimates indicate that true inflation was still higher and consumption growth was
      overstated. In contrast, inflation was overstated and growth understated during the low-inflation 1990s. These patterns hold for the
      food Engel curve, and for numerous other categories, such as grain
      as a fraction of food.
    link_notes:
    - >-
      [The Economist (3/15/14): An Alternative View](http://www.economist.com/news/finance-and-economics/21599051-chinas-official-figures-both-understate-and-overstate-inflation-alternative-view)
  - id: 27
    title: 'Fiscal Stimulus in a Monetary Union: Evidence from U.S. Regions'
    pdflink: "/papers/fiscal.pdf"
    coauthors: with [Emi Nakamura](http://eml.berkeley.edu/~enakamura)
    book: "*American Economic Review*, 104(3), 753-792, March 2014."
    abstract: >-
      We use rich historical data on military procurement to estimate
      the effects of government spending. We exploit regional variation
      in military buildups to estimate an “open economy relative multiplier” of approximately 1.5. We develop a framework for interpreting this estimate and relating it to estimates of the standard
      closed economy aggregate multiplier. The latter is highly sensitive
      to how strongly aggregate monetary and tax policy “leans against
      the wind.” Our open economy relative multiplier “differences out”
      these effects because monetary and tax policies are uniform across
      the nation. Our evidence indicates that demand shocks can have
      large effects on output. 
    resources:
      - type: note
        text: "[Technical Appendix](/papers/fiscalAppendix.pdf) -- [Data and Programs](/papers/FiscalDataPrograms.zip) -- [Erratum](/papers/ErratumFiscal.pdf)"
      - type: note
        text: "[How to Get Military Prime Contract Data](/papers/HowToGetMilitaryPrimeContractData.pdf)"
      - type: note
        text: "Vox Article: [Does Fiscal Stimulus Work in a Montary Union?](https://cepr.org/voxeu/columns/does-fiscal-stimulus-work-monetary-union-evidence-us-regions)"
  - id: 26
    title: Crises and Recoveries in an Empirical Model of Consumption Disasters
    pdflink: "/papers/cdisasters.pdf"
    coauthors: >-
      with [Emi Nakamura](http://eml.berkeley.edu/~enakamura), [Robert Barro](https://scholar.harvard.edu/barro/home)
      and [José Ursúa](https://www.linkedin.com/in/jose-ursua)
    book: "*American Economic Journal: Macroeconomics*, 5(3), 35-74, July 2013."
    abstract: >-
      We estimate an empirical model of consumption disasters using new
      data on consumption for 24 countries over more than 100 years, and
      study its implications for asset prices. The model allows for partial recoveries after disasters that unfold over multiple years. We
      find that roughly half of the drop in consumption due to disasters
      is subsequently reversed. Our model generates a sizable equity premium from disaster risk, but one that is substantially smaller than
      in simpler models. It implies that a large value of the intertemporal
      elasticity of substitution is necessary to explain stock-market crashes
      at the onset of disasters.
    resources:
      - type: note
        text: "[Technical Appendix](/papers/cdisasterswebappendix.pdf) -- [Data and Programs](/papers/DisastersDataAndPrograms.zip)"
      - type: note
        text: "Vox Article: [Disasters, Recoveries, and the Equity Premium](https://cepr.org/voxeu/columns/disasters-recoveries-and-equity-premium)"
  - id: 25
    title: 'Lost in Transit: Product Replacement Bias and Pricing to Market'
    pdflink: "/papers/ippsubs.pdf"
    coauthors: with [Emi Nakamura](http://eml.berkeley.edu/~enakamura)
    book: "*American Economic Review*, 102(7), 3277-3316, December 2012."
    abstract: >-
      In the microdata underlying US trade price indexes, 40 percent of
      products are replaced before a single price change is observed and
      70 percent are replaced after two price changes or fewer. A price
      index that focuses on price changes for identical items may, therefore, miss an important component of price adjustment occurring
      at the time of product replacements. We provide a model of this
      “product replacement bias” and quantify its importance using US
      data. Accounting for product replacement bias, long-run exchange
      rate “pass-through” is substantially higher than conventional estimates suggest, and the terms of trade are substantially more volatile. 
    link_notes:
    - >-
      [Comments on Gagnon, Mandel, and Vigfusson (2013)](/papers/CommentsOnGagnonMandelVigfusson.pdf)
  - id: 24
    title: Price Setting in Forward-Looking Customer Markets
    pdflink: "/papers/habit.pdf"
    coauthors: with [Emi Nakamura](http://eml.berkeley.edu/~enakamura)
    book: "*Journal of Monetary Economics*, 58(3), 220-233, April 2011."
    abstract: >-
      If consumers form habits in individual goods, firms face a time-inconsistency problem.
      Low prices in the future help attract customers in the present. Firms, therefore, have an
      incentive to promise low prices in the future, but price gouge when the future arrives.
      In this setting, firms benefit from "committing to a sticky price." If consumers have
      incomplete information about costs and demand, the firm-preferred equilibrium has
      the firm price at or below a "price cap." The model therefore provides an explanation for
      the simultaneous existence of a rigid regular price and frequent "sales".
    resources:
      - type: note
        text: "[Technical Appendix](/papers/habitwebapp.pdf) -- [Firm Price Commitments](/papers/HabitOnlineAppendix.pdf)"
  - id: 23
    title: Monetary Non-Neutrality in a Multi-Sector Menu Cost Model
    pdflink: "/papers/heterogeneity.pdf"
    coauthors: with [Emi Nakamura](http://eml.berkeley.edu/~enakamura)
    book: "*Quarterly Journal of Economics*, 125(3), 961-1013, August 2010."
    abstract: >-
      Empirical evidence suggests that as much as one-third of the U.S. business
      cycle is due to nominal shocks. We calibrate a multisector menu cost model using
      new evidence on the cross-sectional distribution of the frequency and size of price
      changes in the U.S. economy. We augment the model to incorporate intermediate
      inputs. We show that the introduction of heterogeneity in the frequency of price
      change triples the degree of monetary non-neutrality generated by the model. We
      furthermore show that the introduction of intermediate inputs raises the degree
      of monetary non-neutrality by another factor of three, without adversely affecting
      the model's ability to match the large average size of price changes. A single-sector
      model with a frequency of price change equal to the median, rather than the mean,
      generates monetary non-neutrality similar to that in our multisector model. Our
      multisector model with intermediate inputs generates variation in real output in
      response to calibrated aggregate nominal shocks that can account for roughly 23%
      of the U.S. business cycle.
    resources:
      - type: note
        text: "[Erratum](/papers/MultisectorErratum.pdf) -- [Appendix](/papers/heterogeneityAppendix.pdf) -- [Replication Code](/papers/MenuCostModelCode.zip) -- [Documentation](/papers/MenuCostModelReadme.pdf)"
  - id: 22
    title: 'Five Facts About Prices: A Reevaluation of Menu Cost Models'
    pdflink: "/papers/fivefacts.pdf"
    coauthors: with [Emi Nakamura](http://eml.berkeley.edu/~enakamura)
    book: "*Quarterly Journal of Economics*, 123(4), 1415-1464, November 2008."
    abstract: >-
      We establish five facts about prices in the U.S. economy: (1) For consumer
      prices, the median frequency of nonsale price change is roughly half of what it is
      including sales (9-12% per month versus 19-20% per month for identical items;
      11-13% per month versus 21-22% per month including product substitutions). The
      median frequency of price change for finished-goods producer prices is comparable
      to that of consumer prices excluding sales. (2) One-third of nonsale price changes
      are price decreases. (3) The frequency of price increases covaries strongly with
      inflation, whereas the frequency of price decreases and the size of price increases
      and price decreases do not. (4) The frequency of price change is highly seasonal: it
      is highest in the first quarter and then declines. (5) We find no evidence of upwardsloping hazard functions of price changes for individual products. We show that the
      first, second, and third facts are consistent with a benchmark menu-cost model,
      whereas the fourth and fifth facts are not.
    resources:
      - type: note
        text: "[Tables (Excel)](/papers/fivefactsTablesForWeb.xls) -- [Tables from Supplement (Excel)](/papers/fivefactsTablesforWebSup.xls) -- [ELI table (Excel)](/papers/fivefactsELITableSup1.xls)"
      - type: note
        text: "Supplementary Material: [More Facts About Prices](/papers/fivefactssupplement.pdf)"
      - type: note
        text: "Frequency of Price Change by ELI: [ELI table (PDF)](/papers/fivefactsELITable.pdf)"
      - type: note
        text: "[The Economist (11/9/06): Sticky Situations](/papers/Economist200611.pdf)"
