  - id: 34
    title: 'The Elusive Costs of Inflation: Price Dispersion during the U.S. Great Inflation'
    pdflink: "/papers/costsinflation.pdf"
    coauthors: >-
      with [Emi Nakamura](http://eml.berkeley.edu/~enakamura), [Patrick Sun](https://sites.google.com/site/patrickksun/home),
      and [Daniel Villar](https://www.federalreserve.gov/econres/daniel-villar-vallenas.htm)
    book: "*Quarterly Journal of Economics*, 133(4), 1933-1980, November 2018."
    abstract: >-
      A key policy question is: how high an inflation rate should central banks
      target? This depends crucially on the costs of inflation. An important concern
      is that high inflation will lead to inefficient price dispersion. Workhorse New
      Keynesian models imply that this cost of inflation is very large. An increase in
      steady state inflation from 0% to 10% yields a welfare loss that is an order of
      magnitude greater than the welfare loss from business cycle fluctuations in output
      in these models. We assess this prediction empirically using a new data set on
      price behavior during the Great Inflation of the late 1970s and early 1980s in the
      United States. If price dispersion increases rapidly with inflation, we should see
      the absolute size of price changes increasing with inflation: price changes should
      become larger as prices drift further from their optimal level at higher inflation
      rates. We find no evidence that the absolute size of price changes rose during the
      Great Inflation. This suggests that the standard New Keynesian analysis of the
      welfare costs of inflation is wrong and its implications for the optimal inflation
      rate need to be reassessed. We also find that (nonsale) prices have not become
      more flexible over the past 40 years.
    resources:
      - type: note
        text: "[Appendix](/papers/costsinflationAppendix.pdf) -- [Slides](/papers/oldcpi.pdf) -- [ELI Concordance](/papers/ELIconcordance.xls) -- [Replication Files](/papers/OldCPIReplication.zip)"
  - id: 33
    title: 'High Frequency Identification of Monetary Non-Neutrality: The Information Effect'
    pdflink: "/papers/realrate.pdf"
    coauthors: with [Emi Nakamura](http://eml.berkeley.edu/~enakamura)
    book: "*Quarterly Journal of Economics*, 133(3), 1283-1330, August 2018."
    abstract: >-
      We present estimates of monetary non-neutrality based on evidence from highfrequency responses of real interest rates, expected inflation, and expected output
      growth. Our identifying assumption is that unexpected changes in interest rates in
      a 30-minute window surrounding scheduled Federal Reserve announcements arise
      from news about monetary policy. In response to an interest rate hike, nominal
      and real interest rates increase roughly one-for-one, several years out into the
      term structure, while the response of expected inflation is small. At the same time,
      forecasts about output growth also increase—the opposite of what standard models
      imply about a monetary tightening. To explain these facts, we build a model in
      which Fed announcements affect beliefs not only about monetary policy but also
      about other economic fundamentals. Our model implies that these information
      effects play an important role in the overall causal effect of monetary policy shocks
      on output.
