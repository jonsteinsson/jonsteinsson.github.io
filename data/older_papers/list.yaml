works:
- title: 'The Obama Effect on Economic Outcome: Evidence from Event Studies'
  pdflink: "/pdf/obama10-07-08.pdf"
  book: July 2010
  abstract: >
    Racial differences in economic outcomes are wide-spread and persistent. Theories of statistical discrimination and of identity, but not of taste-based discrimination, posit that these differences are the effect of perceptions–of skills and of identity. Whether racial outcomes respond to change in racial perceptions, therefore, can shed some evidence on the nature of the observed racial differences. In this paper, I study the impact of an event that has plausibly changed the perceptions of what African Americans can achieve: Barack Obama’s election. I use an event study methodology and focus on key election events, such as the first primary victory (Jan. ‘08), the convention (Aug. ‘08), the general election (Nov. ‘08) and the inauguration (Jan. ‘09). I consider first the impact on a measure of discrimination, racial bias in traffic stops. I find evidence of discrimination against Blacks, but the extent of discrimination does not change with the Obama events. I then consider the impact on crime rates, labor force participation, applications to Law School, contribution to public goods (measured by organ donations), and time spent in investment activities. Across these outcomes, the Obama election events did not have an immediate impact for Blacks compared to Whites, with the possible exception of Law School applications. While the Obama election could change beliefs over the long term, in the short-term it does not appear to have changed behavior.
