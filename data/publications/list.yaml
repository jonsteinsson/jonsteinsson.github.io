    text: 'Self-Control in the Market: Evidence from the Health Club Industry'
  abstract: >
    How do consumers choose from a menu of contracts? We analyze a novel dataset
    from three U.S. health clubs with information on both the contractual choice and the
    day-to-day attendance decisions of 7,752 members over three years. The observed
    consumer behavior is difficult to reconcile with standard preferences and beliefs.
    First, members who choose a contract with a flat monthly fee of over $70 attend on
    average 4.3 times per month. They pay a price per expected visit of more than $17,
    even though they could pay $10 per visit using a 10-visit pass. On average, these
    users forgo savings of $600 during their membership. Second, consumers who
    choose a monthly contract are 17 percent more likely to stay enrolled beyond one
    year than users committing for a year. This is surprising because monthly members
    pay higher fees for the option to cancel each month. We also document cancellation
    delays and attendance expectations, among other findings. Leading explanations for
    our findings are overconfidence about future self-control or about future efficiency.
    Overconfident agents overestimate attendance as well as the cancellation probability of automatically renewed contracts. Our results suggest that making inferences from observed contract choice under the rational expectation hypothesis can
    lead to biases in the estimation of consumer preferences.
- title: 'Contract Design and Self-Control: Theory and Evidence'
  pdflink: /pdf/ContractDesignQJE04.pdf
  coauthors: Ulrike Malmendier
  book: Quarterly Journal of Economics, May 2004, Vol. 119(2), pp. 353–402.
  abstract: >
    How do rational firms respond to consumer biases? In this paper we analyze
    the profit-maximizing contract design of firms if consumers have time-inconsistent preferences and are partially naive about it. We consider markets for two
    types of goods: goods with immediate costs and delayed benefits (investment
    goods) such as health club attendance, and goods with immediate benefits and
    delayed costs (leisure goods) such as credit card-financed consumption. We establish three features of the profit-maximizing contract design with partially naive
    time-inconsistent consumers. First, firms price investment goods below marginal
    cost. Second, firms price leisure goods above marginal cost. Third, for all types of
    goods firms introduce switching costs and charge back-loaded fees. The contractual design targets consumer misperception of future consumption and underestimation of the renewal probability. The predictions of the theory match the
    empirical contract design in the credit card, gambling, health club, life insurance,
    mail order, mobile phone, and vacation time-sharing industries. We also show
    that time inconsistency has adverse effects on consumer welfare only if consumers
    are naive.
- title: Job Search and Impatience
  pdflink: /pdf/draft-0507JOLE.pdf
  coauthors: M. Daniele Paserman
  book: Journal of Labor Economics, July 2005, Vol. 23(3), pp. 527–588.
  abstract: >
    Workers who are more impatient search less intensively and set lower
    reservation wages. The effect of impatience on exit rates from unemployment is therefore unclear. If agents have exponential time preferences, the reservation wage effect dominates for sufficiently patient
    individuals, so increases in impatience lead to higher exit rates. The
    opposite is true for agents with hyperbolic time preferences. Using
    two large longitudinal data sets, we find that impatience measures are
    negatively correlated with search effort and the unemployment exit
    rate and are orthogonal to reservation wages. Impatience substantially
    affects outcomes in the direction predicted by the hyperbolic model.
