- title: 'Capital Budgeting vs. Market Timing: An Evaluation Using Demographics'
  pdflink: /pdf/dellavigna_pollet_6106_paper.pdf
  coauthors: Joshua Pollet
  book: Journal of Finance, February 2013, Vol. 68(1), pp. 237–270.
  links:
  - url: /pdf/demogrcf11-02-21OnlineApp.pdf
    text: Online Appendix
  abstract: >
    Using demand shifts induced by demographics, we evaluate capital budgeting and
    market timing. Capital budgeting implies that industries anticipating positive demand shifts in the near future should issue more equity to finance greater capacity.
    To the extent that demographic shifts in the distant future are not incorporated
    into equity prices, market timing implies that industries anticipating positive demand shifts in the distant future should issue less equity due to undervaluation.
    The evidence supports both theories: new listings and equity issuance respond
    positively to demand shifts during the next five years and negatively to demand
    shifts further in the future.
- title: 'Persuasion: Empirical Evidence'
  pdflink: /pdf/PersuasionAERDellaVignaGentzkowProofsJun10.pdf
  coauthors: Matthew Gentzkow
  book: Annual Review of Economics, September 2010, Vol. 2, pp. 643–669.
  abstract: >
    We provide a selective survey of empirical evidence on the effects as
    well as the drivers of persuasive communication. We consider persuasion directed at consumers, voters, donors, and investors. We
    organize our review around four questions. First, to what extent
    does persuasion affect the behavior of each of these groups? Second, what models best capture the response to persuasive communication? Third, what are persuaders’ incentives, and what limits
    their ability to distort communications? Finally, what evidence
    exists on the way persuasion affects equilibrium outcomes in economics and politics?
- title: Detecting Illegal Arms Trade
