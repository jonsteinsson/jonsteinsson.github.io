works:
- title: Policy Diffusion and Polarization across U.S. States
  pdflink: /pdf/PolicyDiffusion2025-05-12.pdf
  coauthors: Woojin Kim
  book: The Review of Economic Studies, forthcoming.
  abstract: >
    Economists have studied the impact of numerous state laws, from welfare rules to voting ID requirements. Yet for all this policy evaluation, what do we know about policy diffusion—how these policies are introduced and spread from state to state? We present a series of facts based on a data set of 602 U.S. state policies spanning the past 7 decades. First, proxies of state capacity do not predict a higher likelihood of innovating new policies, but the political leaning of the state does predict a higher likelihood of introducing partisan laws since 1990. Second, the diffusion of policies from 1950 to 2000 is best predicted by proximity—a state is more likely to adopt a policy if nearby states have already done so—as well as similarity in voter policy preferences. Third, since 2000, party alignment has become the strongest predictor of diffusion, and the speed of adoption has increased. Models of learning and correlated preferences can account for the earlier patterns, but the findings for the last two decades indicate a sharply increasing role of party control. We conclude that party polarization has emerged as a key factor recently for policy adoption, plausibly leading to a worse match between state policies and voter preferences.
- title: Bottlenecks for Evidence Adoption
  pdflink: /pdf/Bottlenecks2023-12-21.pdf
  coauthors: Woojin Kim and Elizabeth Linos
  book: Journal of Political Economy, August 2024, Vol. 132, pp. 2748–2789.
  abstract: >
    Governments increasingly use RCTs to test innovations, yet we know little about how they incorporate results into policy-making. We study 30 U.S. cities that ran 73 RCTs with a national Nudge Unit. Cities adopt a nudge treatment into their communications in 27% of the cases. We find that the strength of the evidence and key city features do not strongly predict adoption; instead, the largest predictor is whether the RCT was implemented using pre-existing communication, as opposed to new communication. We identify organizational inertia as a leading explanation: changes to pre-existing infrastructure are more naturally folded into subsequent processes.
- title: Gender Gaps at the Academies
  pdflink: /pdf/Draft_NBER_Sept_2022.pdf
  coauthors: David Card, Patricia Funk and Nagore Iriberri
  book: Proceedings of the National Academy of Sciences, January 2023, Vol. 120(4), e2212421120.
  links:
  - url: /pdf/Appendix_Merged_Sept.pdf
    text: Online Appendix
  abstract: >
    Historically, a large majority of newly elected members of the National Academy of Science (NAS) and the American Academy of Arts and Science (AAAS) were men. Within the past two decades, however, that situation has changed, and in the last 3 y, women made up about 40% of the new members in both academies. We build lists of active scholars from publications in the top journals in three fields—psychology, mathematics, and economics—and develop a series of models to compare changes in the probability of selection of women as members of the NAS and AAAS from the 1960s to today, controlling for publications and citations. In the early years of our sample, women were less likely to be selected as members than men with similar records. By the 1990s, the selection process at both academies was approximately gender neutral, conditional on publications and citations. In the past 20 y, however, a positive preference for female members has emerged and strengthened in all three fields. Currently, women are 3 to 15 times more likely to be selected as members of the AAAS and NAS than men with similar publication and citation records. The positive preference for women may be in part a reflection of concerns that women face higher barriers to publishing in top journals and may receive less credit for their work.
- title: Evidence on Job Search Models from a Survey of Unemployed Workers in Germany
  pdflink: /pdf/UISurvey_wp_Paper_2021_09_10_QJE_Format.pdf
  coauthors: Joerg Heining, Johannes F. Schmieder and Simon Trenkle
  book: Quarterly Journal of Economics, May 2022, Vol. 137, pp. 1181–1232.
  links:
  - url: /pdf/UISurvey_wp_Appendix_2021_08_30.pdf
    text: Online Appendix
  abstract: >
    The job finding rate of Unemployment Insurance (UI) recipients declines in the initial months of unemployment and then exhibits a spike at the benefit exhaustion point. A range of theoretical explanations have been proposed, but those are hard to disentangle using data on job finding alone. To better understand the underlying mechanisms, we conducted a large text-message-based survey of unemployed workers in Germany. We surveyed 6,349 UI recipients twice a week for 4 months about their job search effort. The panel structure allows us to observe how search effort evolves within individuals over the unemployment spell. We provide three key facts: 1) search effort is flat early on in the UI spell, 2) search effort exhibits an increase up to UI exhaustion and a decrease thereafter, 3) UI recipients do not appear to time job start dates to coincide with the UI exhaustion point. A standard search model with unobserved heterogeneity struggles to explain the second fact, and a model of storable offers is not consistent with the third fact. The patterns are well captured by a model of reference-dependent job search or by a model with duration dependence in search cost.
- title: Estimating Social Preferences and Gift Exchange at Work
  pdflink: /pdf/SocialPreferencesWorkAug27.pdf
  coauthors: John List, Ulrike Malmendier and Gautam Rao
  book: American Economic Review, March 2022, Vol. 112, pp. 1038–1074.
  links:
  - url: /pdf/SocialPreferencesWorkOnlAppAug27.pdf
    text: Online Appendix
  abstract: >
    We design three field experiments to estimate how workers’ social preferences towards their employer motivates their work effort. We vary the pay rates offered to workers, the return to the employer, and employer generosity demonstrated via unexpected gifts. Workers exert effort even without private incentives, but their effort is insensitive to the return to the employer. This is consistent with ‘warm glow’ but not pure altruism. The gifts have no effect on productivity, but engender extra work. This difference is explained partly by the finding that extra work is much more responsive to incentives than is productivity.
- title: "Stability of Experimental Results: Forecasts and Evidence"
  pdflink: /pdf/StabilityApr2021.pdf
  coauthors: Devin Pope
  book: "AEJ: Microeconomics, August 2022, Vol. 14(3), pp. 889–925."
  links:
  - url: /pdf/StabilityExpOnlApp.pdf
    text: Online Appendix
  abstract: >
    How robust are experimental results to changes in design? And can researchers anticipate which changes matter most? We consider a real-effort task with multiple behavioral treatments, and examine the stability along six dimensions: (i) pure replication; (ii) demographics; (iii) geography and culture; (iv) the task; (v) the output measure; (vi) the presence of a consent form. We find near perfect replication of the experimental results, and full stability of the results across demographics, significantly higher than a group of experts expected. The results differ instead across task and output change, mostly because the task change adds noise to the findings.
- title: Gender Differences in Peer Recognition by Economists
  pdflink: /pdf/Card_DellaVigna_Funk_Iriberri_June2021.pdf
  coauthors: David Card, Patricia Funk and Nagore Iriberri
  book: Econometrica, September 2022, Vol. 90(5), pp. 1937–1971.
  abstract: >
    We study the selection of Fellows of the Econometric Society, using a new data set of publications and citations for over 40,000 actively publishing economists since the early 1900s. Conditional on achievement, we document a large negative gap in the probability that women were selected as Fellows in the 1933-1979 period. This gap became positive (though not statistically significant) from 1980 to 2010, and in the past decade has become large and highly significant, with over a 100% increase in the probability of selection for female authors relative to males with similar publications and citations. The positive boost affects highly qualified female candidates (in the top 10% of authors) with no effect for the bottom 90%. Using nomination data for the past 30 years, we find a key proximate role for the Society’s Nominating Committee in this shift. Since 2012 the Committee has had an explicit mandate to nominate highly qualified women, and its nominees enjoy above-average election success (controlling for achievement). Looking beyond gender, we document similar shifts in the premium for geographic diversity: in the mid-2000s, both the Fellows and the Nominating Committee became significantly more likely to nominate and elect candidates from outside the US. Finally, we examine gender gaps in several other major awards for US economists. We show that the gaps in the probability of selection of new fellows of the American Academy of Arts and Sciences and the National Academy of Sciences closely parallel those of the Econometric Society, with historically negative penalties for women turning to positive premiums in recent years.
- title: 'RCTs to Scale: Comprehensive Evidence from Two Nudge Units'
  pdflink: /pdf/NudgeToScale2021-04-19.pdf
  coauthors: Elizabeth Linos
  book: Econometrica, January 2022, Vol. 90(1), pp. 81–116.
  abstract: >
    Nudge interventions have quickly expanded from academic studies to larger implementation in so-called Nudge Units in governments. This provides an opportunity to compare interventions in research studies, versus at scale. We assemble a unique dataset of 126 RCTs covering 23 million individuals, including all trials run by two of the largest Nudge Units in the United States. We compare these trials to a sample of nudge trials in academic journals from two recent meta-analyses. In the Academic Journals papers, the average impact of a nudge is very large—an 8.7 percentage point take-up effect, which is a 33.4% increase over the average control. In the Nudge Units sample, the average impact is still sizable and highly statistically significant, but smaller at 1.4 percentage points, an 8.0% increase. We document three dimensions which can account for the difference between these two estimates: (i) statistical power of the trials; (ii) characteristics of the interventions, such as topic area and behavioral channel; and (iii) selective publication. A meta-analysis model incorporating these dimensions indicates that selective publication in the Academic Journals sample, exacerbated by low statistical power, explains about 70 percent of the difference in effect sizes between the two samples. Different nudge characteristics account for most of the residual difference
- title: 'Forecasting the Results of Experiments: Piloting an Elicitation Strategy'
  pdflink: /pdf/NBER_Forecasting_2019.1.22.pdf
  coauthors: Nicholas Otis and Eva Vivalt
  book: AEA Papers and Proceedings, May 2020, Vol. 110, pp. 75–79.
  abstract: >
    Forecasts	of	experimental	results	can	clarify	the	interpretation	of	research	results,	mitigate	publication	bias,	and	improve	experimental	designs.	We	collect	 forecasts	of	 the	results	of	three	Registered	Reports	preliminarily	accepted	 to	 the	Journal	of	Development	Economics,	randomly	 varying	 four	 features:	 (1)	 small	 versus	 large	 reference	 values;	 (2)	 whether	predictions	are	in	raw	units	or	standard	deviations;	(3)	text-entry	versus	slider	responses;	and	 (4)	 small	 versus	 large	 slider	 bounds.	 Forecasts	 are	 generally	 robust	 to	 elicitation	features,	 though	wider	slider	bounds	are	associated	with	higher	 forecasts	 throughout	 the	forecast	 distribution.	 We	 make	 preliminary	 recommendations	 on	 how	 many	 forecasts should	be	gathered.
- title: What do Editors Maximize? Evidence from Four Economics Journals
  pdflink: /pdf/CardDellaVignaEditorsAug18.pdf
  coauthors: David Card
  book: Review of Economics and Statistics, March 2020, Vol. 102(2), pp. 195–217.
  abstract: >
    We study editorial decisions using anonymized submissions at four leading economics journals: the Journal of the European Economic Association, the Quarterly Journal of Economics, the Review of Economic Studies, and the Review of Economics and Statistics. We match papers to the publication records of authors and referees at the time of submission and to subsequent Google Scholar citations. To guide our analysis, we develop a benchmark model in which editors maximize the expected quality of accepted papers and citations are unbiased measures of quality. We then generalize the model to allow different quality thresholds for different papers, systematic gaps between citations and quality, and a direct impact of publication on citations. Empirically we find that referee recommendations are strong predictors of citations, and that editors follow these recommendations quite closely. We document two main deviations from a citation-maximizing benchmark. First, papers by highly-published authors get more citations, conditional on the referees’ recommendations, suggesting that referees set a higher bar for these authors or that prolific authors are over-cited conditional on quality. Editors’ decisions at the desk-reject and revise-and-resubmit stage show a similar pattern. Second, recommendations of highly-published referees are no more predictive of future citations, yet editors give their views significantly more weight. To help interpret these findings we collect two additional pieces of evidence. We conduct a survey asking field specialists to assess the relative quality of matched papers by more and less prolific authors; our respondents do not appear to believe that prolific authors are over-cited. We also elicit forecasts of the informativeness of referees from a sample of editors and other economists. Both groups believe that highly-published referees are more informative, potentially explaining the extra weight they receive in editors’ decisions.
- title: Are Referees and Editors in Economics Gender Neutral?
  pdflink: /pdf/journals-gender-qje-Sep2019.pdf
  coauthors: David Card, Patricia Funk, Nagore Irriberri
  book: Quarterly Journal of Economics, February 2020, Vol. 135(1), pp. 269–327.
  links:
  - url: /pdf/journals-gender-qje-Sep2019OnlApp.pdf
    text: Online Appendix
  abstract: >
    We study the role of gender in the evaluation of economic research using submissions to
    four leading journals. We find that referee gender has no effect on the relative assessment of
    female- versus male-authored papers, suggesting that any differential biases of male referees
    are negligible. To determine whether referees as a whole impose different standards for female
    authors, we compare citations for female and male-authored papers, holding constant referee
    evaluations and other characteristics. We find that female-authored papers receive about 25%
    more citations than observably similar male-authored papers. Editors largely follow the referees, resulting in a 1.7 percentage point lower probability of a revise and resubmit verdict for
    papers with female authors relative to a citation-maximizing benchmark. In their desk rejection
    decisions, editors treat female authors more favorably, though they still impose a higher bar
    than would be implied by citation-maximization. We find no differences in the informativeness
    of female versus male referees, or in the weight that editors place on the recommendations of
    female versus male referees. We also find no differences in editorial delays for female versus
    male-authored papers.
- title: Uniform Pricing in US Retail Chains
  pdflink: /pdf/uniform-pricing.pdf
  coauthors: Matthew Gentzkow
  book: Quarterly Journal of Economics, November 2019, Vol. 134(4), pp. 2011–2084.
  links:
  - url: /pdf/uniform-pricing_OnlApp.pdf
    text: Online Appendix
  abstract: >
    We show that most US food, drugstore, and mass merchandise chains charge nearly-uniform
    prices across stores, despite wide variation in consumer demographics and competition. Demand estimates reveal substantial within-chain variation in price elasticities and suggest that
    the median chain sacrifices $16m of annual profit relative to a benchmark of optimal prices.
    In contrast, differences in average prices between chains are broadly consistent with the optimal benchmark. We discuss a range of explanations for nearly-uniform pricing, highlighting
    managerial inertia and brand-image concerns as mechanisms frequently mentioned by industry
    participants. Relative to our optimal benchmark, uniform pricing may significantly increase the
    prices paid by poorer households relative to the rich, dampen the response of prices to local economic shocks, alter the analysis of mergers in antitrust, and shift the incidence of intra-national
    trade costs.
- title: Predict Science to Improve Science
  pdflink: https://science.sciencemag.org/content/366/6464/428.abstract
  coauthors: Devin Pope and Eva Vivalt
  book: Science, October 25 2019, Vol. 366, pp. 428–429.
  abstract:  >
    Many fields of research, such as economics, psychology, political science, and medicine, have seen growing interest in new research designs to improve the rigor and credibility of research (e.g., natural experiments, lab experiments, and randomized controlled trials). Interest has similarly grown in efforts to increase transparency, such as preregistration of hypotheses and methods, that seek to allay concerns that improved research designs do not address per se, such as publication bias and p-hacking. Yet, although these efforts improve the informativeness and interpretation of research results, relatively little attention has been paid to another practice that could help to achieve this goal: relating research findings to the views of the scientific community, policy-makers, and the general public. We suggest below three broad ways in which systematic collection of predictions of research results will prove useful: by improving the interpretation of research results, mitigating bias against null results, and improving predictive accuracy and experimental design.
- title: 'Predicting Experimental Results: Who Knows What?'
  pdflink: /pdf/ExpertsMay17JPE.pdf
  coauthors: Devin Pope
  book: Journal of Political Economy, December 2018, Vol. 126(6), pp. 2410–2456.
  links:
  - url: /pdf/ExpertsMay17JPEOnlApp.pdf
    text: Online Appendix
  abstract: >
    We analyze how 208 academic experts forecast the results of 15 treatments involving
    monetary and non-monetary motivators in a real-effort task. We compare these forecasts
    to those made by PhD students and non-experts: undergraduates, MBAs, and an online
    sample. We document seven main results. First, the average forecast of experts predicts
    quite well the experimental results. Second, there is a strong wisdom-of-crowds effect: the
    average forecast outperforms 96 percent of individual forecasts. Third, citations, academic
    rank, field, and contextual experience do not correlate with accuracy. Fourth, experts
    as a group do better than non-experts, but not if accuracy is defined as rank ordering
    treatments. Fifth, measures of effort, confidence, and revealed ability are predictive of
    forecast accuracy to some extent, especially for non-experts. Sixth, using these measures
    we can identify ‘superforecasters’ among the non-experts who outperform the experts out of
    sample. Seventh, these results on forecasting accuracy surprise the forecasters themselves.
    We present and estimate a simple model that organizes our findings.
- title: Structural Behavioral Economics
  pdflink: /pdf/StructBehavJun2018.pdf
  book: Handbook of Behavioral Economics, October 2018, Vol. 1, pp. 613–723.
  abstract: >
    What is the role of structural estimation in behavioral economics? I discuss advantages,
    and limitations, of the work in Structural Behavioral Economics. I also cover common modeling
    choices and how to get started. Among the advantages, I argue that structural estimation builds
    on, and expands, a classical behavioral tool, simple calibrations, and that it benefits from the
    presence of a few parsimonious behavioral models which can be taken to the data. Estimation
    is also well suited for experimental work, common in behavioral economics, as it can lead to
    improvements in the experimental design. In addition, at a time where policy implications of
    behavioral work are increasingly discussed, it is important to ground these policy implications
    in (estimated) models. Structural work, however, has important limitations, which are relevant
    to its behavioral applications. Estimation takes much longer and the extra degree of complexity
    can make it difficult to know which of a series of assumptions is driving the results. For related
    reasons, it is also easy to over-reach with the welfare implications. Taking this into account,
    I provide a partial how-to guide to structural behavioral economics, covering: (i) the choice
    of estimation method; (ii) the modeling of heterogeneity; (iii) identification and sensitivity.
    Finally, I discuss common issues for the estimation of leading behavioral models. I illustrate
    this discussion with selected coverage of existing work in the literature.
- title: What Motivates Effort? Evidence and Expert Forecasts
  pdflink: /pdf/BehavioralForecastsApr17.pdf
  coauthors: Devin Pope
  book: Review of Economic Studies, April 2018, Vol. 85, pp. 1029–1069.
  links:
  - url: /pdf/BehavioralForecastsApr17OnlApp.pdf
    text: Online Appendix
  abstract: >
    How much do different monetary and non-monetary motivators induce costly effort?
    Does the effectiveness line up with the expectations of researchers and with results in the
    literature? We conduct a large-scale real-effort experiment with 18 treatment arms. We
    examine the effect of (i) standard incentives; (ii) behavioral factors like social preferences
    and reference dependence; and (iii) non-monetary inducements from psychology. We find
    that (i) monetary incentives work largely as expected, including a very low piece rate treatment which does not crowd out effort; (ii) the evidence is partly consistent with standard
    behavioral models, including warm glow, though we do not find evidence of probability
    weighting; (iii) the psychological motivators are effective, but less so than incentives. We
    then compare the results to forecasts by 208 academic experts. On average, the experts anticipate several key features, like the effectiveness of psychological motivators. A sizeable
    share of experts, however, expects crowd-out, probability weighting, and pure altruism,
    counterfactually. As a further comparison, we present a meta-analysis of similar treatments in the literature. Overall, predictions based on the literature are correlated with,
    but underperform, the expert forecasts.
- title: 'Reference-Dependent Job Search: Evidence from Hungary'
  pdflink: /pdf/HungaryUIRD_wp_2016_12_16_QJE-format.pdf
  coauthors: Attila Lindner, Balazs Reizer and Johannes F. Schmieder
  book: Quarterly Journal of Economics, November 2017, Vol. 132(4), pp. 1969–2018.
  links:
  - url: /pdf/Web_Appendix.pdf
    text: Online Appendix
  abstract: We propose a model of job search with reference-dependent preferences, with loss aversion
    relative to recent income (the reference point). In this model, newly unemployed individuals
    search hard since consumption is below their reference point. Over time, though, they get
    used to lower income, and thus reduce their search effort. In anticipation of a benefit cut
    their search effort rises again, then declines once they get accustomed to the lower post-cut
    benefit level. The model fits the typical pattern of exit from unemployment, even with no
    unobserved heterogeneity. To distinguish between this and other models, we use a unique
    reform in the UI benefit path. In 2005, Hungary switched from a single-step UI system to a
    two-step system, with overall generosity unchanged. The system generated increased hazard
    rates in anticipation of, and especially following, benefit cuts in ways the standard model has
    a hard time explaining. We estimate a model with optimal consumption, endogenous search
    effort, and unobserved heterogeneity. The reference-dependent model fits the hazard rates
    substantially better than plausible versions of the standard model, including habit formation.
    Our estimates indicate a slow-adjusting reference point and substantial impatience, likely
    reflecting present-bias.
- title: Does Conflict of Interest Lead to Biased Coverage? Evidence from Movie Reviews
  pdflink: /pdf/movieratings16-09-15withOnlApp.pdf
  coauthors: Johannes Hermle
  book: Review of Economic Studies, October 2017, Vol. 84(4), pp. 1510–1550.
  abstract: >
    Media outlets are increasingly owned by conglomerates, inducing a conflict of interest:
    a media outlet can bias its coverage to benefit companies in the same group. We test for
    bias by examining movie reviews in media outlets owned by News Corp, such as the Wall
    Street Journal, and Time Warner, such as Time. We find higher ratings for 20th Century
    Fox movies in News Corp. outlets compared to movies by other studios. To disentangle
    bias from correlation of taste, we introduce and validate a novel matching procedure using
    individual movie ratings from online platforms. Using this procedure, we find no evidence
    of bias in News Corp. nor Time Warner outlets. We reject even small effects, such as
    bias of one extra star (out of four) every 13 movies. We test for differential bias when the
    return to bias is plausibly higher, examine bias by media outlet and by journalist, as well
    as editorial bias. We also consider bias by omission–whether media outlets are more likely
    to review highly-rated movies by affiliated studios–and conflict of interest within a movie
    aggregator. In none of these dimensions do we find evidence of bias. We relate to previous
    work and discuss three explanations for the lack of bias in our setting: high values of media
    reputation, organizational features in a conglomerate, and low returns to bias.
- title: Voting to Tell Others
  pdflink: /pdf/turnout16-05-23.pdf
  coauthors: John List, Ulrike Malmendier and Gautam Rao
  book: Review of Economic Studies, January 2017, Vol. 84(1), pp. 143–181.
  abstract: >
    Why do people vote? We design a field experiment to estimate a model of voting
    ‘because others will ask’. The expectation of being asked motivates turnout if individuals
    derive pride from telling others that they voted, or feel shame from admitting that they did
    not vote, provided that lying is costly. In a door-to-door survey about election turnout,
    we experimentally vary (i) the informational content and use of a flyer pre-announcing
    the survey, (ii) the duration and payment for the survey, and (iii) the incentives to lie
    about past voting. The experimental results indicate significant social image concerns.
    For the 2010 Congressional election, we estimate a value of voting ‘to tell others’ of about
    $15, contributing 2 percentage points to turnout. Lastly, we evaluate a get-out-the-vote
    intervention in which we tell potential voters that we will ask if they voted.
- title: 'Market-based Lobbying: Evidence from Advertising Spending in Italy'
  pdflink: /pdf/AEJ_Applied_DellaVigna_et_al._2015_Manuscript.pdf
  coauthors: Ruben Durante, Brian Knight and Eliana La Ferrara
  book: 'AEJ: Applied Economics, January 2016, Vol. 8(1), pp. 224–256.'
  abstract: >
    We analyze a novel lobbying channel: firms attempting to influence businessmenpoliticians through business proxies. In particular, when a politician controls a business,
    firms shift their spending towards the politician’s business in the hopes of securing favorable regulation. We investigate this channel in Italy where government officials are not
    required to divest business holdings. We examine the evolution of advertising spending
    by firms between 1993 and 2009, a period in which Silvio Berlusconi was prime minister
    three separate times, while maintaining control of Italy’s major private television network,
    Mediaset. We develop a theoretical model of this channel and, in the context of this model,
    hypothesize that firms shift their advertising budget towards Mediaset when Berlusconi is
    in power and that this shift is particularly pronounced for regulated firms. Consistent with
    these hypotheses, we document a significant pro-Mediaset bias in the allocation of advertising spending during Berlusconi’s political tenure, and this pattern is especially pronounced
    for companies operating in more regulated sectors. Using these estimates, we estimate that
    Mediaset profits increased by one billion euros during this period and that regulated firms
    anticipated sizeable returns, stressing the economic importance of this lobbying channel.
    These findings provide an additional rationale for rules on conflict of interest.
- title: Economic and Social Impacts of the Media
  pdflink: /pdf/w21360.pdf
  coauthors: Eliana La Ferrara
  book: Handbook of Media Economics, December 2015, Vol. 1, pp. 723–768.
  abstract: >
    In this survey, we review the literature on the impact of exposure to the media. We cast a wide net
    and cover media impacts on education, family choices, labor and migration decisions, environmental
    choices, health, crime, public economics, attitudes, consumption and savings, and development
    economics. We stress five themes. First, the demand for entertainment plays a key role, with the
    economic impacts emerging largely as by-products. Second, to understand the media effects one
    cannot just focus on the direct effect of exposure but one needs to take into account the crowding-out of alternative activities (substitution effect). Third, the sources of identification play a critical
    role in determining what is known: credible estimates of short- and long run effects are available
    for some topics and some media but not for others. Fourth, most of the evidence on social and
    economic impacts is for exposure to the entertainment media such as television, as opposed to the
    printed press. Fifth, for the policy impacts both the substitution effect of media exposure and the
    demand for entertainment play an important role.
- title: 'Page Limits on Economics Articles: Evidence from Two Journals'
  pdflink: /pdf/j_card_283-after-tim1.pdf
  coauthors: David Card
  book: Journal of Economic Perspectives, Summer 2014, Vol. 28(3), pp. 149–168.
- title: 'Cross-border media and nationalism: Evidence from Serbian radio in Croatia'
  pdflink: /pdf/Croatian_paper_13_08_13.pdf
  coauthors: Ruben Enikolopov, Vera Mironova, Maria Petrova and Ekaterina Zhuravskaya
  book: 'AEJ: Applied Economics, July 2014, Vol. 6, pp. 103-132.'
  links:
  - url: /pdf/Croatian_paper_13_08_13_OnlineAppendix.pdf
    text: Online Appendix
  abstract: >
    How do nationalistic media affect animosity between ethnic groups? We consider one of
    Europe’s deadliest conflicts since WWII: the Serbo-Croatian conflict. We show that, after a
    decade of peace, cross-border nationalistic Serbian radio triggers ethnic hatred towards Serbs
    in Croatia. Mostly attracted by non-political content, many Croats listen to Serbian public
    radio (intended for Serbs in Serbia) whenever signal is available. As a result, the vote for
    extreme nationalist parties is higher, and ethnically offensive graffiti are more common, in
    Croatian villages with Serbian radio reception. A laboratory experiment confirms that Serbian
    radio exposure causes anti-Serbian sentiment among Croats. 
- title: 'The Importance of Being Marginal: Gender Differences in Generosity'
  pdflink: /pdf/GenderGenerosityAERPP2013Final.pdf
  coauthors: John A. List, Ulrike Malmendier, and Gautam Rao
  book: American Economic Review Papers and Proceedings, May 2013, Vol. 103(3), pp.
    586–590.
  links:
  - url: /pdf/GenderGenerosityAERP_P2013OnlineApp.pdf
    text: Online Appendix
  abstract: >
    Do men and women have different social preferences? Previous findings are contradictory. We
    provide a potential explanation using evidence from a field experiment. In a door-to-door
    solicitation, men and women are equally generous, but women become less generous when it
    becomes easy to avoid the solicitor. Our structural estimates of the social preference parameters
    suggest an explanation: women are more likely to be on the margin of giving, partly because of a
    less dispersed distribution of altruism. We find similar results for the willingness to complete an
    unpaid survey: women are more likely to be on the margin of participation. 
- title: Nine Facts about Top Journals in Economics
  pdflink: /pdf/CardDellaVignaTop5PapersJEL2013.pdf
  coauthors: David Card
  book: Journal of Economic Literature, March 2013, Vol. 51(1), pp. 144–161.
  links:
  - url: /pdf/CardDellaVignaTop5PapersJEL2013OnlApp.pdf
    text: Online Appendix
  - url: /pdf/NineFactsTopJournalsUpdate2018.pdf
    text: Update to "Nine Facts about Top Journals in Economics" (4/2018)
  abstract: >
    How has publishing in top economics journals changed since 1970? Using a data set
    that combines information on all articles published in the top-five journals from 1970
    to 2012 with their Google Scholar citations, we identify nine key trends. First, annual
    submissions to the top-five journals nearly doubled from 1990 to 2012. Second, the
    total number of articles published in these journals actually declined from 400 per
    year in the late 1970s to 300 per year most recently. As a result, the acceptance rate
    has fallen from 15 percent to 6 percent, with potential implications for the career
    progression of young scholars. Third, one journal, the American Economic Review,
    now accounts for 40 percent of top-five publications, up from 25 percent in the 1970s.
    Fourth, recently published papers are on average three times longer than they were
    in the 1970s, contributing to the relative shortage of journal space. Fifth, the number
    of authors per paper has increased from 1.3 in 1970 to 2.3 in 2012, partly offsetting
    the fall in the number of articles per year. Sixth, citations for top-five publications
    are high: among papers published in the late 1990s, the median number of Google
    Scholar citations is 200. Seventh, the ranking of journals by citations has remained
    relatively stable, with the notable exception of the Quarterly Journal of Economics,
    which climbed from fourth place to first place over the past three decades. Eighth,
    citation counts are significantly higher for longer papers and those written by more
    coauthors. Ninth, although the fraction of articles from different fields published in
    the top five has remained relatively stable, there are important cohort trends in the
    citations received by papers from different fields, with rising citations to more recent
    papers in Development and International, and declining citations to recent papers in
    Econometrics and Theory. 
- title: Testing for Altruism and Social Pressure in Charitable Giving
  pdflink: /pdf/CharityQJEFeb12.pdf
