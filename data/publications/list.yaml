  abstract: >
    Laboratory experiments in psychology find that media violence increases aggression in the short run. We analyze whether media violence affects violent crime
    in the field. We exploit variation in the violence of blockbuster movies from 1995
    to 2004, and study the effect on same-day assaults. We find that violent crime
    decreases on days with larger theater audiences for violent movies. The effect is
    partly due to voluntary incapacitation: between 6 P.M. and 12 A.M., a one million increase in the audience for violent movies reduces violent crime by 1.1% to
    1.3%. After exposure to the movie, between 12 A.M. and 6 A.M., violent crime is
    reduced by an even larger percent. This finding is explained by the self-selection
    of violent individuals into violent movie attendance, leading to a substitution
    away from more volatile activities. In particular, movie attendance appears to
    reduce alcohol consumption. The results emphasize that media exposure affects
    behavior not only via content, but also because it changes time spent in alternative activities. The substitution away from more dangerous activities in the field
    can explain the differences with the laboratory findings. Our estimates suggest
    that in the short run, violent movies deter almost 1,000 assaults on an average weekend. Although our design does not allow us to estimate long-run effects, we find no evidence of medium-run effects up to three weeks after initial
    exposure
- title: Investor Inattention and Friday Earnings Announcements
  pdflink: /pdf/earnfr080204.pdf
