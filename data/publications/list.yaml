  links:
  - url: /datacode/AEJDataPostingZip.zip
    text: Data
  abstract: >
    We propose a method to detect illegal arms trade based on investor
    knowledge. We focus on countries under arms embargo and identify events that suddenly increase or decrease conflict intensity. If a
    weapon-making company is trading illegally, an event that increases
    the demand for arms may increase stock prices. We find positive
    event returns for companies headquartered in countries with high
    corruption and low transparency in arms trade. We also suggest a
    method to detect potential embargo violations based on chains of
    reactions by individual stocks. The presumed violations positively
    correlate with the number of UN investigations and Internet stories. 
- title: The Effect of Fast Food Restaurants on Obesity and Weight Gain
  pdflink: /pdf/FastFoodAEJ2010.pdf
  coauthors: Janet Currie, Enrico Moretti and Vikram Pathania
  book: 'AEJ: Economic Policy, August 2010, Vol. 2(3), pp. 32–63.'
  abstract: >
    We investigate how changes in the supply of fast food restaurants
    affect weight outcomes of 3 million children and 3 million pregnant
    women. Among ninth graders, a fast food restaurant within 0.1 miles
    of a school results in a 5.2 percent increase in obesity rates. Among
    pregnant women, a fast-food restaurant within 0.5 miles of residence
    results in a 1.6 percent increase in the probability of gaining over
    20 kilos. The implied effects on caloric intake are one order of magnitude larger for children than for mothers, consistent with smaller
    travel cost for adults. Non-fast food restaurants and future fast-food
    restaurants are uncorrelated with weight outcomes. 
- title: 'Psychology and Economics: Evidence from The Field'
  pdflink: /pdf/01-DellaVigna-4721.pdf
  book: Journal of Economic Literature, June 2009, Vol. 47(2), pp. 315–372.
  links:
  - url: /pdf/pefieldevid08-08-07Longer.pdf
    text: Older Version
  abstract: >
    The research in Psychology and Economics (a.k.a. Behavioral Economics) suggests that
    individuals deviate from the standard model in three respects: (1) nonstandard preferences, (2) nonstandard beliefs, and (3) nonstandard decision making. In this paper, I
    survey the empirical evidence from the field on these three classes of deviations. The
    evidence covers a number of applications, from consumption to finance, from crime to
    voting, from charitable giving to labor supply. In the class of nonstandard preferences,
    I discuss time preferences (self-control problems), risk preferences (reference dependence), and social preferences. On nonstandard beliefs, I present evidence on overconfidence, on the law of small numbers, and on projection bias. Regarding nonstandard
    decision making, I cover framing, limited attention, menu effects, persuasion and
    social pressure, and emotions. I also present evidence on how rational actors—firms,
    employers, CEOs, investors, and politicians—respond to the nonstandard behavior
    described in the survey. Finally, I briefly discuss under what conditions experience
    and market interactions limit the impact of the nonstandard features.
- title: Does Movie Violence Increase Violent Crime?
  pdflink: /pdf/moviescrimeQJEProofs2009.pdf
