  - url: /datacode/earnData.shtml
    text: '[Data on accuracy of  earnings announcement dates]'
  abstract: >
    Does limited attention among investors affect stock returns? We compare the
    response to earnings announcements on Friday, when investor inattention is more
    likely, to the response on other weekdays. If inattention influences stock prices, we
    should observe less immediate response and more drift for Friday announcements.
    Indeed, Friday announcements have a 15% lower immediate response and a 70%
    higher delayed response. A portfolio investing in differential Friday drift earns substantial abnormal returns. In addition, trading volume is 8% lower around Friday
    announcements. These findings support explanations of post-earnings announcement drift based on underreaction to information caused by limited attention
- title: Demographics and Industry Returns
  pdflink: /pdf/demogrAERFinal.pdf
  coauthors: Joshua Pollet
  book: American Economic Review, December 2007, Vol. 97(5), pp. 1667–1702.
  abstract: >
    How do investors respond to predictable shifts in profitability? We consider how
    demographic shifts affect profits and returns across industries. Cohort size fluctuations produce forecastable demand changes for age-sensitive sectors, such as
    toys, bicycles, beer, life insurance, and nursing homes. These demand changes are
    predictable once a specific cohort is born. We use lagged consumption and demographic data to forecast future consumption demand growth induced by changes
    in age structure. We find that demand forecasts predict profitability by industry.
    Moreover, forecast demand changes five to ten years in the future predict annual
    industry stock returns. One additional percentage point of annualized demand
    growth due to demographics predicts a 5 to 10 percentage point increase in annual
    abnormal industry stock returns. However, forecasted demand changes over shorter
    horizons do not predict stock returns. A trading strategy exploiting demographic
    information earns an annualized risk-adjusted return of approximately 6 percent.
    We present a model of inattention to information about the distant future that is
    consistent with the findings. We also discuss alternative explanations, including
    omitted risk-based factors.
- title: 'The Fox News Effect: Media Bias and Voting'
  pdflink: /pdf/FoxVoteQJEAug07.pdf
  coauthors: Ethan Kaplan
  book: Quarterly Journal of Economics, August 2007, Vol. 122(3), pp. 1187–1234.
  links:
  - url: /datacode/foxnewsData.shtml
    text: Data
  abstract: >
    Does media bias affect voting? We analyze the entry of Fox News in cable
    markets and its impact on voting. Between October 1996 and November 2000, the
    conservative Fox News Channel was introduced in the cable programming of 20
    percent of U. S. towns. Fox News availability in 2000 appears to be largely
    idiosyncratic, conditional on a set of controls. Using a data set of voting data for
    9,256 towns, we investigate if Republicans gained vote share in towns where Fox
    News entered the cable market by the year 2000. We find a significant effect of the
    introduction of Fox News on the vote share in Presidential elections between 1996
    and 2000. Republicans gained 0.4 to 0.7 percentage points in the towns that
    broadcast Fox News. Fox News also affected voter turnout and the Republican
    vote share in the Senate. Our estimates imply that Fox News convinced 3 to 28
    percent of its viewers to vote Republican, depending on the audience measure. The
    Fox News effect could be a temporary learning effect for rational voters, or a
    permanent effect for nonrational voters subject to persuasion.
