- title: Using Multiple Outcomes to Adjust Standard Errors for Spatial Correlation
  pdflink: "/pdf/tmo.pdf"
  coauthors: Guido Imbens, Woojin Kim and David M. Ritzwoller
  book: April 2025
  abstract: >
    Empirical research in economics often examines the behavior of agents located in a geographic space. In such cases, statistical inference is complicated by the interdependence of economic outcomes across locations. A common approach to account for this dependence is to cluster standard errors based on a predefined geographic partition. A second strategy is to model dependence in terms of the distance between units. Dependence, however, does not necessarily stop at borders and is typically not determined by distance alone. This paper introduces a method that leverages observations of multiple outcomes to adjust standard errors for cross-sectional dependence. Specifically, a researcher, while interested in a particular outcome variable, often observes dozens of other variables for the same units. We show that these outcomes can be used to estimate dependence under the assumption that the cross-sectional correlation structure is shared across outcomes. We develop a procedure, which we call Thresholding Multiple Outcomes (TMO), that uses this estimate to adjust standard errors in a given regression setting. We show that adjustments of this form can lead to sizable reductions in the bias of standard errors in calibrated U.S. county-level regressions. Re-analyzing nine recent papers, we find that the proposed correction can make a substantial difference in practice.
- title: Understanding Expert Choices Using Decision Time
  pdflink: "/pdf/DecisionTime_April.pdf"
  coauthors: David Card, Chenxi Jiang and Dmitry Taubinsky
  book: April 2024
  abstract: >
    Laboratory experiments find a robust relationship between decision times and perceived values of alternatives. This paper investigates how these findings translate to experts’ decision making and information acquisition in the field. In a stylized model of expert choice between two alternatives, we show that (i) less-commonly chosen alternatives are more likely to be chosen later than earlier; (ii) decision time is higher when the likelihood of choosing each alternative is closer to fifty percent; and (iii) the ultimate quality of the chosen alternative may increase or decrease with decision time, depending on whether earlier or later signals are more informative. We test these predictions in the editorial setting, where we observe proxies for paper quality and signals available to editors. We document that (i) the probability of a positive decision rises with decision time; (ii) average decision time is higher when our estimated probability of a positive decision is closer to fifty percent; and (iii) paper quality is positively (negatively) related to decision time for papers with Reject (R&R) decisions. Structural estimates show that the additional information acquired in editorial delays is modest, and has little impact on the quality of decisions.
